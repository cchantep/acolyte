version: 2.1

commands:
  setup_sbt:
    description: Get and install SBT
    parameters:
      sbt_version:
        type: string
        default: "2.0.7"
    steps:
      - restore_cache:
          keys:
          - &sbt_cache_key sbt-{{ checksum "project/build.properties" }}

      - run:
          name: Setup SBT
          command: |
                    if [ ! -x ~/sbt/bin/sbt ]; then
                      cd ~/
                      curl --silent -L -o sbt.tgz https://github.com/sbt/sbt/releases/download/v<< parameters.sbt_version >>/sbt-<< parameters.sbt_version >>.tgz
                      tar -xzvf sbt.tgz && rm -f sbt.tgz
                    fi

      - save_cache:
          paths:
            - ~/sbt
          key: *sbt_cache_key

  build_n_tests:
    description: Build & Run tests
    steps:
      - restore_cache:
          keys:
          - &scala_cache_key scala-{{ .Environment.CIRCLE_JOB }}-{{ checksum "version.sbt" }}-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}-{{ checksum "project/Dependencies.scala" }}

      - run:
          name: Build & Run tests
          command: |
                    export PATH=$PATH:~/sbt/bin
                    export USER=`basename $HOME`
                    
                    ./.ci_scripts/validate.sh

      - save_cache:
          paths:
            - ~/.ivy2
            - ~/.coursier/cache
            - ~/.sbt
          key: *scala_cache_key

  collect_test_reports:
    description: Collect test reports
    steps:
      - run:
          name: Collect test report
          command: |
                    mkdir test-reports
                    find . -path '*/test-reports/*' -name '*.xml' \
                      -print -exec cp {} test-reports \;
          when: always

jobs:
  scala212_jdk26:
    docker:
      - image: cimg/openjdk:26.0

    working_directory: ~/repo

    environment:
      SCALA_VERSION: 2.12
    
    steps:
      - checkout
      - setup_sbt
      - build_n_tests
      - collect_test_reports
      - store_test_results:
          path: test-reports

  scala213_jdk26:
    docker:
      - image: cimg/openjdk:26.0

    working_directory: ~/repo

    environment:
      SCALA_VERSION: 2.13
    
    steps:
      - checkout
      - setup_sbt
      - build_n_tests
      - collect_test_reports
      - store_test_results:
          path: test-reports

  scala3_jdk26:
    docker:
      - image: cimg/openjdk:26.0

    working_directory: ~/repo

    environment:
      SCALA_VERSION: 3.4
    
    steps:
      - checkout
      - setup_sbt
      - build_n_tests
      - collect_test_reports
      - store_test_results:
          path: test-reports

  jdbc_mcp_jdk17:
    docker:
      - image: cimg/openjdk:17.0
      - image: postgres:15
        environment:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
    working_directory: ~/repo

    steps:
      - checkout
      - setup_sbt
      - restore_cache:
          keys:
          - &jdbc_mcp_cache_key jdbc-mcp-{{ checksum "version.sbt" }}-{{ checksum "build.sbt" }}

      - run:
          name: Compile jdbc-mcp
          command: |
                    export PATH=$PATH:~/sbt/bin
                    sbt jdbc-mcp/compile

      - run:
          name: Run jdbc-mcp tests
          command: |
                    export PATH=$PATH:~/sbt/bin
                    sbt --server jdbc-mcp/test
          environment:
            POSTGRES_HOST: localhost
            POSTGRES_PORT: "5432"
            POSTGRES_DB: test_db
            POSTGRES_USER: test_user
            POSTGRES_PASSWORD: test_password

      - save_cache:
          paths:
            - ~/.ivy2
            - ~/.coursier/cache
            - ~/.sbt
          key: *jdbc_mcp_cache_key

      - collect_test_reports
      - store_test_results:
          path: test-reports

  publish_snapshots:
    docker:
      - image: cimg/openjdk:26.0

    working_directory: ~/repo
    
    steps:
      - checkout
      - setup_sbt
      - deploy:
          name: Publish artifacts to Sonatype Snapshots
          command: |
            set -e

            if [ ! "${CIRCLE_BRANCH}" = "master" ]; then
              echo "Skipped on branch ${CIRCLE_BRANCH}"
              exit 0
            fi

            if [ "x$PUBLISH_USER" = "x" -o "x$PUBLISH_PASS" = "x" ]; then
              echo "Missing publication credentials"
              exit 1
            fi

            V=$(sbt --server 'show version' 2>&1 | sed 's/\x1b\[0[Jm]//g' | grep --color=never '[0-9]\+\.[0-9]\+' | tail -1 | sed 's/\[info\]//' | xargs | tr -cd '[:alnum:]._-')

            if [[ "$V" != *SNAPSHOT* ]]; then
              echo "Skip non snapshot: $V"
              exit 0
            fi

            export PUBLISH_REPO_NAME="Sonatype Nexus Repository Manager"
            export PUBLISH_REPO_ID="central.sonatype.com"
            export PUBLISH_REPO_URL="https://central.sonatype.com/repository/maven-snapshots/"

            sbt +publish

workflows:
  version: 2

  main_suite:
    jobs:
      - scala212_jdk26
      - scala213_jdk26
      - scala3_jdk26

      - jdbc_mcp_jdk17

      - publish_snapshots:
          filters:
            branches:
              only:
                - master
          requires:
            - scala212_jdk26
            - scala213_jdk26
            - scala3_jdk26
